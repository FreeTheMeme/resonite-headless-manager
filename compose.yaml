services:
  resoniteheadlessmanager:
    image: resoniteheadlessmanager
    build:
      context: .
      dockerfile: ./Dockerfile
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group ID of /var/run/docker.sock}"
    ports:
      - 8000:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
